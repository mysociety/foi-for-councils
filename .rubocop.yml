---
inherit_from: .rubocop_todo.yml

require:
  - rubocop-performance
  - rubocop-rails

AllCops:
  Exclude:
    - 'bin/bundle'
    - 'bin/ci'
    - 'bin/dev'
    - 'bin/rails'
    - 'bin/rake'
    - 'bin/rubocop'
    - 'bin/setup'
    - 'config/application.rb'
    - 'config/boot.rb'
    - 'config/ci.rb'
    - 'config/environment.rb'
    - 'config/environments/*.rb'
    - 'config/initializers/assets.rb'
    - 'config/initializers/content_security_policy.rb'
    - 'config/initializers/filter_parameter_logging.rb'
    - 'config/initializers/inflections.rb'
    - 'config/puma.rb'
    - 'config/rails_env.rb'
    - 'db/migrate/**'
    - 'db/schema.rb'
    - 'gems/**/*'
    - 'lib/mysociety/validate.rb'
    - 'vendor/**/*'
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 2.7

Metrics/BlockLength:
  Exclude:
    - 'spec/factories/*.rb'
    - 'spec/**/*_spec.rb'
    - 'config/routes.rb'

Layout/LineLength:
  Max: 80
  IgnoredPatterns:
    - '^\s*it\s+.*do$'
    - '^\s*context\s+.*do$'
    - '^\s*describe\s+.*do$'

Layout/DotPosition:
  EnforcedStyle: trailing

Rails:
  Enabled: true

Style/ClassAndModuleChildren:
  EnforcedStyle: nested

Style/MixinUsage:
  Exclude:
    - 'bin/update'
